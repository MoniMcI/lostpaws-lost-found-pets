backend:
  name: github
  repo: MoniMcI/lostpaws-lost-found-pets
  branch: main

publish_mode: editorial_workflow

media_folder: "public/images/pets"
public_folder: "/images/pets"

collections:
  - name: pets
    label: Pets
    folder: src/content/pets
    create: true
    slug: "{{slug}}"

    fields:
      - label: Pet name
        name: name
        widget: string

      - label: Status
        name: status
        widget: select
        options:
          - Lost
          - Found
          - Reunited

      - label: Species
        name: species
        widget: select
        options:
          - Dog
          - Cat
          - Other

      - label: Breed
        name: breed
        widget: string

      - label: Photos
        name: photos
        widget: list
        min: 1
        max: 3
        field:
          label: Photo
          name: photo
          widget: image

      - label: Date
        name: date
        widget: datetime
        format: "YYYY-MM-DD"

      - label: Location
        name: location
        widget: string

      - label: Contact name
        name: contactName
        widget: string

      - label: Contact information
        name: contactInfo
        widget: string

      - label: Distinguishing features
        name: distinguishingFeatures
        widget: text

      - label: Description
        name: body
        widget: markdown